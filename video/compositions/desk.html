  <script>
    const tl = gsap.timeline({ paused: true });
    // Camera: put stage point (cx, cy) at the frame centre at scale s.

    const press = (sel, t) => {
      tl.fromTo(sel + " .key", { scale: 1 }, { scale: 0.94, y: 3, duration: 0.07, stagger: 0.05, ease: "power2.out" }, t);
      tl.to(sel + " .key", { scale: 1, y: 0, duration: 0.12, stagger: 0.05, ease: "power2.out" }, t + 0.1);
    };
    const keysIn = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, t);
    const keysOut = (sel, t) => tl.to(sel, { opacity: 0, y: 24, duration: 0.22, ease: "power3.in" }, t);

    // ----- initial state -----

    gsap.set(["#d-keys-mac", "#d-keys-pc", "#d-keys-pc2"], { opacity: 0 });
    gsap.set("#d-sel", { scaleX: 0, transformOrigin: "0 50%" });
    gsap.set("#d-bridge-path", { strokeDashoffset: 1 });
    gsap.set("#d-cursor", { x: 1500, y: 1000 });
    gsap.set("#d-chip", { x: 250, y: 380 });
    gsap.set(["#d-arm", "#d-arm2"], { rotation: -1.08 });
    gsap.set(["#d-rider", "#d-rider2"], { rotation: 1.08 });
    gsap.set("#d-arm-chip", { xPercent: -50, yPercent: -50, scale: 0.6 });
    gsap.set("#d-img-chip", { xPercent: -50, yPercent: -50 });
    gsap.set("#d-caret", { opacity: 1 });

    // ----- hook: the two computers -----
    cam(0, 960, 455, 1.1, 3.0);
    tl.to("#d-mac-dim", { opacity: 0, duration: 0.35, ease: "power2.out" }, 3.08);
    tl.to("#d-pc-dim", { opacity: 0, duration: 0.35, ease: "power2.out" }, 4.37);
    // the email's caret blinks while it waits (finite)
    tl.to("#d-caret", { opacity: 0, duration: 0.01, repeat: 37, yoyo: true, repeatDelay: 0.52 }, 0.5);

    // ----- the little ritual: select and copy on the Mac -----
    tl.to("#d-cursor", { x: 248, y: 434, duration: 1.1, ease: "expo.out" }, 6.2);
    cam(7.2, 420, 440, 1.8, 0.9);
    tl.to("#d-cursor", { x: 556, duration: 0.5, ease: "power1.inOut" }, 7.75);
    tl.to("#d-sel", { scaleX: 1, duration: 0.5, ease: "power1.inOut" }, 7.75);
    keysIn("#d-keys-mac", 8.25);
    press("#d-keys-mac", 8.4);
    tl.fromTo("#d-chip", { opacity: 0, y: 380, scale: 0.92 }, { opacity: 1, y: 372, scale: 1, duration: 0.35, ease: "expo.out" }, 8.5);
    keysOut("#d-keys-mac", 9.0);
    tl.to("#d-cursor", { opacity: 0, duration: 0.2 }, 9.0);
    cam(9.0, 960, 455, 1.1, 0.9);
    // ...and it's stuck there: the link runs into the Mac's bezel
    tl.to("#d-chip", { x: 436, duration: 0.4, ease: "power3.in" }, 9.9);
    tl.to("#d-chip", { x: 404, scaleX: 0.97, duration: 0.14, ease: "power2.out" }, 10.3);
    tl.to("#d-chip", { x: 416, scaleX: 1, duration: 0.5, ease: "elastic.out(1, 0.5)" }, 10.44);

    // ----- what if it could cross over? (the detours overlay plays 11.7–19.1) -----
    tl.to("#d-bridge-path", { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 20.16);
    // the stuck chip hands over to the rider at the bridge's foot
    tl.to("#d-chip", { x: 700 - 215, y: 330 - 22, scale: 0.6, duration: 0.3, ease: "power2.in" }, 21.6);
    tl.set("#d-chip", { opacity: 0 }, 21.9);
    tl.set("#d-arm-chip", { opacity: 1 }, 21.9);
    tl.to("#d-arm", { rotation: 181.08, duration: 0.75, ease: "power2.inOut" }, 21.9);
    tl.to("#d-rider", { rotation: -181.08, duration: 0.75, ease: "power2.inOut" }, 21.9);
    tl.to("#d-arm-chip", { opacity: 0, scale: 0.4, duration: 0.2, ease: "power3.in" }, 22.62);
    tl.fromTo("#d-toast", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 22.62);

    // ----- this is ClipBridge: the apex becomes the icon, the desk falls away -----
    // the apex is at stage (965, 60): at the wide camera (scale 1.1 around y 455) that is frame (965.5, 105.5)
    tl.fromTo("#d-icon", { opacity: 0, x: 965.5 - 100, y: 105.5 - 100, scale: 0 }, { opacity: 1, scale: 0.4, duration: 0.35, ease: "expo.out" }, 22.72);
    tl.to("#d-icon", { x: 522, y: 440, scale: 1, duration: 0.58, ease: "power2.inOut" }, 23.07);
    tl.to("#d-world", { opacity: 0, filter: "blur(14px)", duration: 0.35, ease: "power2.in" }, 23.1);
    tl.fromTo("#d-word", { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "expo.out" }, 23.66);
    tl.to(["#d-icon", "#d-word"], { opacity: 0, scale: 0.94, duration: 0.25, ease: "power3.in" }, 24.4);

    // ----- copy on your Mac, paste on your PC -----
    tl.set("#d-toast", { opacity: 0 }, 24.4);
    tl.set("#d-bridge", { opacity: 0 }, 24.4); // hidden while the camera is close on one screen
    cam(24.4, 420, 440, 1.8, 0.01);
    tl.to("#d-world", { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 24.45);
    keysIn("#d-keys-mac", 24.75);
    press("#d-keys-mac", 24.92);
    keysOut("#d-keys-mac", 25.45);
    cam(25.55, 1290, 330, 1.8, 0.5, "power3.inOut");
    tl.fromTo("#d-stage", { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.25, ease: "power2.in", yoyo: true, repeat: 1 }, 25.55);
    keysIn("#d-keys-pc", 25.95);
    press("#d-keys-pc", 26.13);
    tl.set("#d-caret", { x: 300 }, 26.16);
    tl.set("#d-pc-link", { opacity: 1 }, 26.16);
    tl.fromTo("#d-pc-link", { backgroundColor: "rgba(85,80,216,0.22)" }, { backgroundColor: "rgba(85,80,216,0)", duration: 0.9, ease: "power2.out" }, 26.16);

    tl.fromTo("#d-pc-link", { backgroundColor: "rgba(85,80,216,0)" }, { backgroundColor: "rgba(85,80,216,0.18)", duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, repeatDelay: 0.4 }, 28.4);

    cam(28.8, 960, 455, 1.1, 0.8);
    tl.to("#d-bridge", { opacity: 1, duration: 0.3, ease: "power2.out" }, 29.2);
    tl.fromTo("#d-pc-img", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 29.0);
    keysIn("#d-keys-pc2", 29.3);
    press("#d-keys-pc2", 29.5);
    keysOut("#d-keys-pc2", 30.0);
    tl.set("#d-arm2", { rotation: 181.08 }, 29.6);
    tl.set("#d-rider2", { rotation: -181.08 }, 29.6);
    tl.fromTo("#d-img-chip", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 0.75, duration: 0.2, ease: "power2.out" }, 29.68);
    tl.to("#d-arm2", { rotation: -1.08, duration: 0.8, ease: "power2.inOut" }, 29.82);
    tl.to("#d-rider2", { rotation: 1.08, duration: 0.8, ease: "power2.inOut" }, 29.82);

    window.__timelines["desk"] = tl;
