  <script>
    const tl = gsap.timeline({ paused: true });
    // Scene time = film time - 41.85. Camera: put window point (cx, cy) at the frame centre at scale s.
    const cam = (t, cx, cy, s, d, ease) => tl.to("#h-stage", { x: 960 - cx * s, y: 540 - cy * s, scale: s, duration: d, ease: ease || "power2.inOut" }, t);
    const BASE = { cx: 250, cy: 380, s: 1.42 };
    const STEP = 76; // item height + gap
    gsap.set("#h-stage", { transformOrigin: "0 0", x: 960 - BASE.cx * 1.3, y: 540 - BASE.cy * 1.3, scale: 1.3 });
    cam(0, BASE.cx, BASE.cy, BASE.s, 1.4, "power2.out");
    gsap.set(["#h-results", "#h-c2", "#h-c3", "#h-toast", "#h-doc", "#h-doc-tag", "#r-flash"], { opacity: 0 });

    gsap.set(".fly", { xPercent: -50, yPercent: -50, opacity: 0 });
    gsap.set("#h-cursor", { x: 330, y: 420, opacity: 0 });
    tl.to("#h-cursor", { opacity: 1, duration: 0.15 }, 7.0);

    // ----- everything you copy, on both computers, lands in one shared history -----
    // The newest items wait above the viewport; each arrival slides the list down one slot.
    const fresh = ["#i-6", "#i-5", "#i-4", "#i-3", "#i-2", "#i-1"];
    const later = [{ id: "#i-txt", h: STEP }, { id: "#i-fmt", h: 118 }, { id: "#i-shot", h: 252 }];
    const hidden = fresh.length * STEP + later.reduce((a, b) => a + b.h, 0);
    gsap.set("#h-list", { y: -hidden });
    gsap.set([...fresh, ...later.map((l) => l.id)], { opacity: 0 });
    gsap.set("#h-list .cb-day:first-child", { y: hidden });
    let y = -hidden;
    fresh.forEach((id, i) => {
      const t = 0.3 + i * 0.55;
      y += STEP;
      tl.to("#h-list", { y, duration: 0.45, ease: "expo.out" }, t);
      tl.to("#h-list .cb-day:first-child", { y: -y, duration: 0.45, ease: "expo.out" }, t);
      tl.fromTo(id, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3 }, t + 0.08);
      const fromMac = i % 2 === 1;
      const sx = fromMac ? 260 : 1670, sy = fromMac ? 470 : 450;
      tl.fromTo("#f-" + (6 - i), { opacity: 0, x: sx, y: sy, scale: 0.9 }, { opacity: 1, x: sx, y: sy, scale: 1, duration: 0.12 }, t - 0.42);
      tl.to("#f-" + (6 - i), { x: 960, y: 300, scale: 0.55, duration: 0.4, ease: "power2.in" }, t - 0.3);
      tl.to("#f-" + (6 - i), { opacity: 0, duration: 0.1 }, t + 0.06);
    });

    tl.to(["#hd-mac", "#hd-pc"], { opacity: 0, y: 30, duration: 0.3, ease: "power3.in" }, 5.6);

    // ----- with no limit: the history runs back for months -----
    tl.to("#h-list", { y: y - 1900, duration: 1.15, ease: "power2.inOut" }, 5.3);
    tl.to("#h-list .cb-day:first-child", { opacity: 0, duration: 0.15 }, 5.3);

    tl.set("#h-q", { textContent: "q" }, 6.45);
    tl.set("#h-q", { textContent: "q3" }, 6.6);

    tl.fromTo("#h-results", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15 }, 6.82);
    tl.to("#h-c1", { opacity: 0, duration: 0.1 }, 6.82);
    tl.to("#h-c2", { opacity: 1, duration: 0.1 }, 6.86);

    // ----- star what matters -----
    tl.to("#h-cursor", { x: 433, y: 228, duration: 0.5, ease: "expo.out" }, 7.1);
    tl.to("#r-star", { scale: 0.85, duration: 0.07, yoyo: true, repeat: 1 }, 7.7);
    tl.fromTo("#r-star-on", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 7.72);

    tl.to("#r-1", { scale: 0.985, duration: 0.07, yoyo: true, repeat: 1 }, 9.13);

    cam(12.1, 470, BASE.cy, BASE.s, 0.5);
